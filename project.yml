# Generates DynamicIsland.xcodeproj. Run `xcodegen generate` (or scripts/run.sh)
# after adding or removing files. The generated project is not committed.
name: DynamicIsland

options:
  bundleIdPrefix: com.dynamicisland
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  IslandKit:
    path: Packages/IslandKit
  # Updates: checks the appcast on GitHub, verifies the EdDSA signature, installs.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: KNK4UH42NN
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  DynamicIsland:
    type: application
    platform: macOS
    sources:
      - path: App/DynamicIsland
    dependencies:
      - package: IslandKit
        product: IslandCore
      - package: Sparkle
      - target: NowPlayingBridge
        link: false
        embed: true
        codeSign: true
    info:
      path: App/DynamicIsland/Info.plist
      properties:
        CFBundleDisplayName: Dynamic Island
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSPrefersDisplaySafeAreaCompatibilityMode: false
        NSCalendarsFullAccessUsageDescription: Dynamic Island shows your next event and a Join button on the island.
        NSAppleEventsUsageDescription: Dynamic Island reads Up Next and AirPlay speakers from Music, and track info from Spotify when the system Now Playing source is unavailable.
        NSBluetoothAlwaysUsageDescription: Dynamic Island shows AirPods and other Bluetooth devices, with their batteries, when they connect.
        NSLocationUsageDescription: Dynamic Island shows the weather where you are. Coordinates are rounded to about 1 km.
        NSLocationWhenInUseUsageDescription: Dynamic Island shows the weather where you are. Coordinates are rounded to about 1 km.
        NSDownloadsFolderUsageDescription: Dynamic Island shows the progress of downloads arriving in your Downloads folder.
        NSHumanReadableCopyright: Personal project
        CFBundleURLTypes:
          - CFBundleURLName: com.dynamicisland.mac
            CFBundleURLSchemes: [dynamicisland]
        # Sparkle: the appcast attached to the latest GitHub release, checked daily.
        # Updates must be signed with the private key in the login Keychain
        # (account com.dynamicisland.mac); this is its public half.
        SUFeedURL: https://github.com/manu-tech-code/dynamic-island/releases/latest/download/appcast.xml
        SUPublicEDKey: gn4eKuPKn8p+s/xn9/mJJ3vRAcb1uvIogEQczSSzNQs=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: App/DynamicIsland/DynamicIsland.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_NAME: DynamicIsland
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamicisland.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  NowPlayingBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: App/NowPlayingBridge
    settings:
      base:
        PRODUCT_NAME: NowPlayingBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["-framework", "Foundation"]

schemes:
  DynamicIsland:
    build:
      targets:
        DynamicIsland: all
    run:
      config: Debug
    archive:
      config: Release
