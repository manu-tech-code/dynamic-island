# Generates DynamicIsland.xcodeproj. Run `xcodegen generate` (or scripts/run.sh)
# after adding or removing files. The generated project is not committed.
name: DynamicIsland

options:
  bundleIdPrefix: com.dynamicisland
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  IslandKit:
    path: Packages/IslandKit

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: KNK4UH42NN
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  DynamicIsland:
    type: application
    platform: macOS
    sources:
      - path: App/DynamicIsland
    dependencies:
      - package: IslandKit
        product: IslandCore
      - target: NowPlayingBridge
        link: false
        embed: true
        codeSign: true
    info:
      path: App/DynamicIsland/Info.plist
      properties:
        CFBundleDisplayName: Dynamic Island
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSPrefersDisplaySafeAreaCompatibilityMode: false
        NSCalendarsFullAccessUsageDescription: Dynamic Island shows your next event and a Join button on the island.
        NSAppleEventsUsageDescription: Dynamic Island reads the current track from Music or Spotify when the system Now Playing source is unavailable.
        NSHumanReadableCopyright: Personal project
        CFBundleURLTypes:
          - CFBundleURLName: com.dynamicisland.mac
            CFBundleURLSchemes: [dynamicisland]
    entitlements:
      path: App/DynamicIsland/DynamicIsland.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: DynamicIsland
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamicisland.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  NowPlayingBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: App/NowPlayingBridge
    settings:
      base:
        PRODUCT_NAME: NowPlayingBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["-framework", "Foundation"]

schemes:
  DynamicIsland:
    build:
      targets:
        DynamicIsland: all
    run:
      config: Debug
    archive:
      config: Release
